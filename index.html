<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Platformer Mobile</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        canvas { display: block; margin: 0 auto; }
    </style>
</head>
<body>
<script>
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 400,
    parent: 'game-container',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    physics: { default: 'arcade', arcade: { gravity: { y: 800 }, debug: false } },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let player, platforms, enemies, bullets, lastFired = 0;

function preload() {}

function create() {
    // 1. World & Platforms
    platforms = this.physics.add.staticGroup();
    // Ground
    platforms.add(this.add.rectangle(400, 390, 800, 20, 0x333333));
    // Floating Platforms
    platforms.add(this.add.rectangle(200, 280, 150, 15, 0x00ffcc));
    platforms.add(this.add.rectangle(500, 200, 150, 15, 0x00ffcc));
    platforms.add(this.add.rectangle(750, 120, 100, 15, 0x00ffcc));

    // 2. The Player (Purple Square)
    player = this.add.rectangle(50, 300, 30, 30, 0xff00ff);
    this.physics.add.existing(player);
    player.body.setCollideWorldBounds(true);
    this.physics.add.collider(player, platforms);

    // 3. Enemies (Red Triangles)
    enemies = this.physics.add.group();
    let enemy = this.add.triangle(400, 350, 0, 30, 15, 0, 30, 30, 0xff3333);
    this.physics.add.existing(enemy);
    enemies.add(enemy);
    enemy.body.setAllowGravity(false);
    enemy.body.setVelocityX(100);
    
    this.physics.add.collider(enemies, platforms);
    this.physics.add.overlap(player, enemies, () => {
        player.setPosition(50, 300); // Reset on hit
    });

    // 4. Bullets Group
    bullets = this.physics.add.group();

    // 5. Input Setup
    this.input.addPointer(3); // Multi-touch for move + jump + shoot
}

function update(time) {
    let pointers = [this.input.pointer1, this.input.pointer2, this.input.pointer3];
    player.body.setVelocityX(0);

    // Enemy Patrol Logic
    enemies.children.iterate(e => {
        if (e.x > 600) e.body.setVelocityX(-100);
        if (e.x < 300) e.body.setVelocityX(100);
    });

    // Touch Controls
    pointers.forEach(p => {
        if (p.isDown) {
            // Movement (Left side of screen)
            if (p.x < 150) player.body.setVelocityX(-200);
            else if (p.x >= 150 && p.x < 300) player.body.setVelocityX(200);
            
            // Jump (Middle)
            if (p.x >= 300 && p.x < 550 && player.body.touching.down) {
                player.body.setVelocityY(-450);
            }

            // Shoot (Right side)
            if (p.x >= 550 && time > lastFired) {
                shootBullet(this);
                lastFired = time + 400; // Fire rate delay
            }
        }
    });

    // Bullet physics - Kill enemy on hit
    this.physics.add.overlap(bullets, enemies, (b, e) => {
        b.destroy();
        e.destroy();
    });
}

function shootBullet(scene) {
    let b = scene.add.rectangle(player.x + 20, player.y, 10, 5, 0xffff00);
    scene.physics.add.existing(b);
    bullets.add(b);
    b.body.setAllowGravity(false);
    b.body.setVelocityX(400);
}
</script>
</body>
</html>
