<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Runner A06 Fixed</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }
        canvas { display: block; touch-action: none; }
    </style>
</head>
<body>
<script>
// Logic to get the absolute maximum screen dimensions
const getScreenSize = () => {
    return {
        w: Math.max(window.innerWidth, window.screen.width),
        h: Math.max(window.innerHeight, window.screen.height)
    };
};

const size = getScreenSize();

const config = {
    type: Phaser.AUTO,
    width: size.w,
    height: size.h,
    scale: {
        mode: Phaser.Scale.RESIZE, // This is key for the A06's long screen
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: { 
        default: 'arcade', 
        arcade: { gravity: { y: 1600 }, debug: false } 
    },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let player, platforms, enemies, bullets, lastFired = 0;
let controls = { left: false, right: false, fire: false };
let facing = 'right';
let uiContainer;

function preload() {}

function create() {
    const worldWidth = 5000;
    const gameW = this.sys.game.config.width;
    const gameH = this.sys.game.config.height;

    this.physics.world.setBounds(0, 0, worldWidth, gameH);
    this.cameras.main.setBounds(0, 0, worldWidth, gameH);

    // 1. Ground and Platforms
    platforms = this.physics.add.staticGroup();
    platforms.add(this.add.rectangle(worldWidth/2, gameH - 20, worldWidth, 40, 0x222222));
    
    for(let i = 0; i < 20; i++) {
        platforms.add(this.add.rectangle(600 + (i * 400), gameH - 180 - (Math.random() * 150), 180, 25, 0x00ffcc));
    }

    // 2. Player
    player = this.add.rectangle(100, gameH - 100, 45, 45, 0xff00ff);
    this.physics.add.existing(player);
    player.body.setCollideWorldBounds(true);
    this.physics.add.collider(player, platforms);
    this.cameras.main.startFollow(player, true, 0.1, 0.1);

    // 3. Enemies
    enemies = this.physics.add.group();
    for(let i = 0; i < 8; i++) {
        let e = this.add.rectangle(1200 + (i * 600), gameH - 100, 40, 40, 0xff3333);
        this.physics.add.existing(e);
        enemies.add(e);
        e.body.setVelocityX(-200);
        e.body.setCollideWorldBounds(true);
    }
    this.physics.add.collider(enemies, platforms);
    this.physics.add.overlap(player, enemies, () => player.setPosition(100, gameH-100));

    // 4. Fixed UI (Using screen percentages for perfect ratio)
    uiContainer = this.add.container(0, 0).setScrollFactor(0);
    
    const setupBtn = (x, y, label, color, dn, up) => {
        let circle = this.add.circle(x, y, 55, color, 0.5).setInteractive();
        let txt = this.add.text(x - 15, y - 18, label, { fontSize: '32px', color: '#fff' });
        uiContainer.add([circle, txt]);
        circle.on('pointerdown', () => { circle.setAlpha(0.9); dn(); });
        circle.on('pointerup', () => { circle.setAlpha(0.5); up(); });
        circle.on('pointerout', () => { circle.setAlpha(0.5); up(); });
    };

    // Mapping to the corners of any screen size
    let padding = 100;
    setupBtn(padding, gameH - padding, "←", 0x444444, () => controls.left = true, () => controls.left = false);
    setupBtn(padding + 130, gameH - padding, "→", 0x444444, () => controls.right = true, () => controls.right = false);
    setupBtn(gameW - 250, gameH - padding, "↑", 0x0000ff, () => { if(player.body.touching.down) player.body.setVelocityY(-800) }, () => {});
    setupBtn(gameW - 100, gameH - padding, "💥", 0xff0000, () => controls.fire = true, () => controls.fire = false);

    bullets = this.physics.add.group();
    this.input.addPointer(3);
}

function update(time) {
    if (controls.left) {
        player.body.setVelocityX(-400);
        facing = 'left';
    } else if (controls.right) {
        player.body.setVelocityX(400);
        facing = 'right';
    } else {
        player.body.setVelocityX(0);
    }

    if (controls.fire && time > lastFired) {
        let dir = (facing === 'right') ? 1 : -1;
        let b = this.add.rectangle(player.x + (dir * 45), player.y, 30, 10, 0xffff00);
        this.physics.add.existing(b);
        bullets.add(b);
        b.body.setAllowGravity(false);
        b.body.setVelocityX(dir * 1000);
        lastFired = time + 180;
    }

    enemies.children.iterate(e => {
        if (e && (e.body.blocked.left || e.body.blocked.right)) {
            e.body.setVelocityX(e.body.velocity.x * -1);
        }
    });

    this.physics.add.overlap(bullets, enemies, (bul, nmy) => { bul.destroy(); nmy.destroy(); });
}
</script>
</body>
</html>
